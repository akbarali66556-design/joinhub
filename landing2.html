<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>{{CHANNEL_TITLE}}</title>
<style>*{box-sizing:border-box;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0a1512;color:#eafff4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#102a20;border:1px solid #1d5c45;max-width:410px;width:100%;border-radius:22px;padding:32px 24px;text-align:center}
.logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#25d366,#128C7E);margin:0 auto 18px;display:grid;place-items:center;font-size:34px}
h1{font-size:23px;line-height:1.3;margin-bottom:8px}p{color:#8fc9b4;line-height:1.55;margin-bottom:22px;font-size:14px}
.btn{display:block;background:#25d366;color:#042f1c;text-decoration:none;font-weight:800;font-size:17px;padding:16px;border-radius:999px}
small{display:block;margin-top:14px;color:#6c9c86;font-size:12px}.hp{position:absolute;left:-9999px}</style></head>
<body><div class="card"><div class="logo">💬</div><h1>{{CHANNEL_TITLE}}</h1>
<p>Join karke group ka instant access paayein. Bilkul free.</p>
<input class="hp" tabindex="-1" autocomplete="off" name="email_confirm" aria-hidden="true">
<a class="btn" href="{{JOIN_URL}}">Join Group</a><small>Free to join • No spam</small></div></body></html>
