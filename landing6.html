<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>{{CHANNEL_TITLE}}</title>
<style>*{box-sizing:border-box;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#061018;color:#e8f7ff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#0d2030;border:1px solid #164a63;max-width:410px;width:100%;border-radius:24px;padding:34px 24px;text-align:center}
.logo{width:78px;height:78px;border-radius:22px;background:linear-gradient(135deg,#06b6d4,#3b82f6);margin:0 auto 18px;display:grid;place-items:center;font-size:34px}
h1{font-size:23px;line-height:1.3;margin-bottom:8px}p{color:#8fc2d6;line-height:1.55;margin-bottom:22px;font-size:14px}
.btn{display:block;background:linear-gradient(135deg,#06b6d4,#3b82f6);color:#042530;text-decoration:none;font-weight:800;font-size:17px;padding:16px;border-radius:999px}
small{display:block;margin-top:14px;color:#6c9cb0;font-size:12px}.hp{position:absolute;left:-9999px}</style></head>
<body><div class="card"><div class="logo">🎯</div><h1>{{CHANNEL_TITLE}}</h1>
<p>Aapko invite kiya gaya hai. Tap karke apna invite accept karein.</p>
<input class="hp" tabindex="-1" autocomplete="off" name="email_confirm" aria-hidden="true">
<a class="btn" href="{{JOIN_URL}}">Accept Invite</a><small>Invite verified</small></div></body></html>
