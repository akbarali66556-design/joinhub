<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>{{CHANNEL_TITLE}}</title>
<style>*{box-sizing:border-box;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f5fb;color:#141a2e;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#fff;border:1px solid #e2e7f2;max-width:410px;width:100%;border-radius:18px;padding:34px 26px;text-align:center;box-shadow:0 10px 40px rgba(20,40,90,.08)}
.logo{width:76px;height:76px;border-radius:18px;background:linear-gradient(135deg,#111827,#374151);margin:0 auto 18px;display:grid;place-items:center;font-size:32px}
h1{font-size:23px;line-height:1.3;margin-bottom:8px}p{color:#6b7490;line-height:1.55;margin-bottom:22px;font-size:14px}
.btn{display:block;background:#111827;color:#fff;text-decoration:none;font-weight:800;font-size:17px;padding:16px;border-radius:12px}
small{display:block;margin-top:14px;color:#9aa3b8;font-size:12px}.hp{position:absolute;left:-9999px}</style></head>
<body><div class="card"><div class="logo">🔔</div><h1>{{CHANNEL_TITLE}}</h1>
<p>Ek tap me join karein. No spam, kabhi bhi unsubscribe.</p>
<input class="hp" tabindex="-1" autocomplete="off" name="email_confirm" aria-hidden="true">
<a class="btn" href="{{JOIN_URL}}">Subscribe</a><small>Trusted source</small></div></body></html>
