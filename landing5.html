<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>{{CHANNEL_TITLE}}</title>
<style>*{box-sizing:border-box;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#1a0c08;color:#fff0ea;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#2c1410;border:1px solid #6b2d1c;max-width:410px;width:100%;border-radius:20px;padding:32px 24px;text-align:center}
.logo{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#ff5a1f,#ffb020);margin:0 auto 18px;display:grid;place-items:center;font-size:34px}
h1{font-size:23px;line-height:1.3;margin-bottom:8px}p{color:#e0a992;line-height:1.55;margin-bottom:22px;font-size:14px}
.btn{display:block;background:linear-gradient(135deg,#ff5a1f,#ffb020);color:#fff;text-decoration:none;font-weight:800;font-size:17px;padding:16px;border-radius:14px}
small{display:block;margin-top:14px;color:#c98a6e;font-size:12px}.hp{position:absolute;left:-9999px}</style></head>
<body><div class="card"><div class="logo">🔥</div><h1>{{CHANNEL_TITLE}}</h1>
<p>Spots jaldi bhar rahe hain. Band hone se pehle join karein.</p>
<input class="hp" tabindex="-1" autocomplete="off" name="email_confirm" aria-hidden="true">
<a class="btn" href="{{JOIN_URL}}">Claim Spot</a><small>Hurry • Few spots left</small></div></body></html>
