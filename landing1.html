<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>{{CHANNEL_TITLE}}</title>
<style>*{box-sizing:border-box;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b1020;color:#eef1ff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#151c33;border:1px solid #26305a;max-width:410px;width:100%;border-radius:20px;padding:32px 24px;text-align:center}
.logo{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#2f7bff,#22d39a);margin:0 auto 18px;display:grid;place-items:center;font-size:36px}
h1{font-size:23px;line-height:1.3;margin-bottom:8px}p{color:#9aa3cc;line-height:1.55;margin-bottom:22px;font-size:14px}
.btn{display:block;background:#2f7bff;color:#fff;text-decoration:none;font-weight:800;font-size:17px;padding:16px;border-radius:14px}
small{display:block;margin-top:14px;color:#6b779e;font-size:12px}.hp{position:absolute;left:-9999px}</style></head>
<body><div class="card"><div class="logo">🚀</div><h1>{{CHANNEL_TITLE}}</h1>
<p>Roz ki sabse zaroori updates seedhe aapke Telegram par.</p>
<input class="hp" tabindex="-1" autocomplete="off" name="email_confirm" aria-hidden="true">
<a class="btn" href="{{JOIN_URL}}">Telegram Channel Join करें</a><small>Button dabane par Telegram khulega</small></div></body></html>
